# 打包与工具链配置（单一事实来源），遵循 docs/开发规范.md
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gearlink"
version = "0.1.0"
description = "轻量级 Agent 框架：ReAct 循环、可插拔模型提供者与工具注册表"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.48.0",
    "pyyaml>=6.0",
    "chromadb>=1.5.9",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.34",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["gearlink*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "UP",  # pyupgrade（现代语法）
]
# 注：导入分组顺序按开发规范手动维护（各组之间空一行），不启用 isort 规则

[tool.pytest.ini_options]
testpaths = ["tests"]

# 覆盖率门禁（开发规范 §6）：核心模块 gearlink/core 覆盖率 ≥ 80%，不达标 CI 失败
[tool.coverage.run]
source = ["gearlink/core"]

[tool.coverage.report]
fail_under = 80
show_missing = true
