# 打包与工具链配置（单一事实来源），遵循 docs/开发规范.md
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gearlink"
version = "0.2.0"
description = "轻量级 Agent 框架：多策略编排（ReAct / 规划-执行 / 多 Agent 协作）+ 模型/记忆/工具三可插拔 + 技能扩展"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GearLink Contributors" }]
keywords = ["agent", "llm", "react", "orchestration", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=2.48.0",
    "pyyaml>=6.0",
    "chromadb>=1.5.9",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.34",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Mzys521/gearlink"
Repository = "https://github.com/Mzys521/gearlink"
Issues = "https://github.com/Mzys521/gearlink/issues"
Changelog = "https://github.com/Mzys521/gearlink/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["gearlink*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "UP",  # pyupgrade（现代语法）
]
# 注：导入分组顺序按开发规范手动维护（各组之间空一行），不启用 isort 规则

[tool.pytest.ini_options]
testpaths = ["tests"]

# 覆盖率门禁（开发规范 §6）：核心模块 gearlink/core 覆盖率 ≥ 80%，不达标 CI 失败
[tool.coverage.run]
source = ["gearlink/core"]

[tool.coverage.report]
fail_under = 80
show_missing = true
