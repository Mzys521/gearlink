name: 功能请求
description: 建议一个新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！请描述清楚要解决的痛点和期望的方案。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前在什么场景下遇到了什么困难？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望框架提供什么样的能力？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现方式？为什么不选它们？

  - type: dropdown
    id: category
    attributes:
      label: 功能分类
      options:
        - Agent 编排（ReAct / Plan / Orchestrator）
        - 模型 Provider
        - 记忆 / 上下文
        - 工具 / MCP
        - 技能
        - 可观测性 / 事件
        - CLI / 服务化
        - 其他
    validations:
      required: true
