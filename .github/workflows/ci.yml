# GearLink CI：格式化检查 + 静态检查 + 测试 + 覆盖率门禁（开发规范 §2/§6）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Test with coverage gate (core >= 80%)
        run: pytest --cov --cov-report=term-missing

  # 历史密钥审查（TODO.md / 开发规范 §9）：gitleaks 扫描全历史提交。
  # 注意：官方 action 需要仓库 secret GITLEAKS_LICENSE（免费开源项目可申请）；
  # 未配置时该 job 会失败，不影响主流程可临时注释，但发布前必须启用。
  # 已知历史问题：旧提交中曾硬编码 API key，除扫描外还须轮换该密钥。
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
